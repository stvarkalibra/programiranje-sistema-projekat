# Naziv aplikacije i port na kome radi
spring.application.name=finansije
server.port=8082

# H2 Baza u memoriji (podaci se gube pri ga?enju aplikacije)
spring.datasource.url=jdbc:h2:mem:finansijedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=asdf
spring.datasource.password=

# JPA / Hibernate pode?avanja
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: Automatski pravi tabele pri pokretanju i bri?e ih pri ga?enju
spring.jpa.hibernate.ddl-auto=create-drop

# Ispis SQL upita u konzoli (korisno za debagovanje)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Pode?avanja za inicijalizaciju baze (data.sql fajl)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Pristup bazi preko browsera na http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Swagger dokumentacija (interfejs za testiranje endpointa)
# Putanja: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# V4 / otpornost
server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# Circuit Breaker za pozive ka rezervacije servisu
resilience4j.circuitbreaker.instances.reservationServiceCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.reservationServiceCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.reservationServiceCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.reservationServiceCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.reservationServiceCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.reservationServiceCB.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.reservationServiceCB.register-health-indicator=true

resilience4j.retry.instances.reservationServiceRetry.ignoreExceptions=java.lang.IllegalArgumentException
resilience4j.circuitbreaker.instances.reservationServiceCB.ignoreExceptions=java.lang.IllegalArgumentException
# Retry za operacije ?itanja
resilience4j.retry.instances.reservationServiceRetry.max-attempts=3
resilience4j.retry.instances.reservationServiceRetry.wait-duration=1s

# Actuator
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents,retries,retryevents,metrics,loggers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Logovi
logging.level.org.springframework.cloud.openfeign=WARN
logging.level.io.github.resilience4j=DEBUG
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j.retry=DEBUG
logging.file.name=logs/finansije-service.log
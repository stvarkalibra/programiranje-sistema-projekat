server.port=8084

services.guide.url=http://localhost:8080
services.adventure.url=http://localhost:8081
services.rezervacije.url=http://localhost:8083
services.finansije.url=http://localhost:8082
services.auth.url=http://localhost:8085

management.endpoints.web.exposure.include=health,info,refresh,gateway
management.endpoint.health.show-details=always

gateway.trace.header-name=X-Trace-Id
gateway.processing-time.header-name=X-Processing-Time-ms

gateway.rate-limit.enabled=true
gateway.rate-limit.max-requests=2
gateway.rate-limit.window-seconds=30

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{traceId}] %logger{36} - %msg%n
# Naziv aplikacije i port na kome radi
spring.application.name=avantura-service
server.port=8081

# H2 Baza u memoriji (podaci se gube pri ga?enju aplikacije)
spring.datasource.url=jdbc:h2:mem:avanturedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=kimi
spring.datasource.password=

# JPA / Hibernate pode?avanja
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# none: Isklju?ujemo automatsko pravljenje jer koristimo schema.sql (zahtev 2)
# Ako jo? uvek testira? samo sa entitetima bez schema.sql, vrati na 'create-drop'
spring.jpa.hibernate.ddl-auto=create-drop

# Ispis SQL upita u konzoli (korisno za debagovanje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pode?avanja za inicijalizaciju baze (data.sql / import.sql fajl)
# Klju?no: defer-datasource-initialization osigurava da se import desi nakon kreiranja tabela
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Pristup bazi preko browsera na http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Swagger dokumentacija (interfejs za testiranje endpointa)
# Putanja: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# --- MONITORING (Actuator - Ta?ka 5 zadatka) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
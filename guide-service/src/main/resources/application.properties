# Naziv aplikacije i port na kome radi
spring.application.name=guice-service
server.port=8080

# H2 Baza u memoriji (podaci se gube pri ga?enju aplikacije)
spring.datasource.url=jdbc:h2:mem:guidedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=kimi
spring.datasource.password=

# JPA / Hibernate pode?avanja
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# none: Isklju?ujemo automatsko pravljenje jer koristimo schema.sql (zahtev 2)
# Ako jo? uvek testira? samo sa entitetima bez schema.sql, vrati na 'create-drop'
spring.jpa.hibernate.ddl-auto=create-drop

# Ispis SQL upita u konzoli (korisno za debagovanje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pode?avanja za inicijalizaciju baze (data.sql / import.sql fajl)
# Klju?no: defer-datasource-initialization osigurava da se import desi nakon kreiranja tabela
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Pristup bazi preko browsera na http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Swagger dokumentacija (interfejs za testiranje endpointa)
# Putanja: http://localhost:8082/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# --- RESILIENCE4J PODE?AVANJA ---

# 1. RETRY (Ponavljanje - Ta?ka 3 zadatka)
# Cilj: Ako ?itanje ne uspe iz prve (npr. mre?a ?tucne), probaj automatski jo? 2 puta
resilience4j.retry.instances.adventureRetry.max-attempts=3
resilience4j.retry.instances.adventureRetry.wait-duration=2s

# 2. CIRCUIT BREAKER (Osigura? - Ta?ka 3 zadatka)
# Cilj: Ako servis 8081 padne, nakon 5 neuspjeha (sliding-window) otvori osigura? na 10 sekundi
resilience4j.circuitbreaker.instances.adventureCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.adventureCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.adventureCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.adventureCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.adventureCB.permitted-number-of-calls-in-half-open-state=3

# --- MONITORING (Actuator - Ta?ka 5 zadatka) ---
# Cilj: Da na odbrani mo?e? pokazati stanje osigura?a preko URL-a
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true